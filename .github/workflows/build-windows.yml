name: Build Windows Package

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: npm install

      - name: Tool versions
        run: |
          node --version
          npm --version
          bun --version

      - name: Build Windows binary
        shell: pwsh
        run: bun build --compile src/main.ts --external electron --outfile dist/forge.exe

      - name: Package Windows zip
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts/package-windows.ps1

      - name: Verify output
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/cognautic-forge-windows.zip")) {
            throw "Expected dist/cognautic-forge-windows.zip was not generated."
          }
          Get-Item "dist/cognautic-forge-windows.zip" | Format-List Name,Length,LastWriteTime

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: cognautic-forge-windows
          path: dist/cognautic-forge-windows.zip

      - name: Resolve release tag
        id: resolve_tag
        uses: actions/github-script@v7
        with:
          script: |
            if (context.eventName === "release") {
              const tag = context.payload.release?.tag_name;
              if (!tag) core.setFailed("Release event missing tag_name");
              core.setOutput("tag", tag);
              return;
            }
            const { data } = await github.rest.repos.getLatestRelease({
              owner: context.repo.owner,
              repo: context.repo.repo
            });
            if (!data?.tag_name) core.setFailed("No latest release tag found");
            core.setOutput("tag", data.tag_name);

      - name: Upload to GitHub Release
        if: steps.resolve_tag.outputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.resolve_tag.outputs.tag }}
          files: dist/cognautic-forge-windows.zip
